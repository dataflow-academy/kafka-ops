# The wind park as participants meet it: healthy base plus the faults.
#
# Every fault is a Kustomize *component* in ../../components/<name> (patches to
# the base: a ConfigMap value, a resource limit, a topic setting, ...). A lab
# that fixes a fault removes its line from `components:` below, or the
# participant removes it by hand; `./prepare.sh training` then converges the
# cluster to whatever this file lists. Each later lab has a start state of the
# form "training minus the faults fixed so far", e.g. overlays/after-<lab>.
#
# No faults are defined yet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components: []
  # - ../../components/<fault>
