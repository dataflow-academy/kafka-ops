apiVersion: apps/v1
kind: Deployment
metadata:
  name: wind-turbine-consumer
  labels: { app.kubernetes.io/name: wind-turbine-consumer, app.kubernetes.io/part-of: wind-park }
spec:
  # Up to 6 are useful: the topic has 6 partitions.
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: wind-turbine-consumer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wind-turbine-consumer, app.kubernetes.io/part-of: wind-park }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: ${WIND_IMAGE_REGISTRY}/java/wind-turbine-consumer-json:${WIND_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: wind-consumer-config }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
