# The healthy wind park. Every knob is a ConfigMap value, so a scenario is a
# patch, never a rebuild. Use it through overlays/, not directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - topic.yaml
  - producer.yaml
  - consumer.yaml
labels:
  - pairs: { app.kubernetes.io/part-of: wind-park }
    includeSelectors: false
# A changed ConfigMap gets a new name, so the Deployments roll out by themselves.
configMapGenerator:
  - name: wind-producer-config
    literals:
      - BOOTSTRAP_SERVERS=my-cluster-kafka-bootstrap.kafka.svc:9092
      - TOPIC=nordwind.scada.public.turbine-telemetry-json.event
      # 50 turbines report per tick: 1000 ms = 50 records/s, 100 ms = 500 records/s.
      - TICK_INTERVAL_MS=1000
      # KAFKA_<NAME> becomes the client config <name> (underscore = dot).
      - KAFKA_ACKS=all
      - KAFKA_LINGER_MS=10
      - KAFKA_COMPRESSION_TYPE=zstd
      - JAVA_OPTS=-XX:MaxRAMPercentage=70
  - name: wind-consumer-config
    literals:
      - BOOTSTRAP_SERVERS=my-cluster-kafka-bootstrap.kafka.svc:9092
      - TOPIC=nordwind.scada.public.turbine-telemetry-json.event
      - GROUP_ID=turbine-monitor
      - JAVA_OPTS=-XX:MaxRAMPercentage=70
