apiVersion: apps/v1
kind: Deployment
metadata:
  name: wind-turbine-producer
  labels: { app.kubernetes.io/name: wind-turbine-producer, app.kubernetes.io/part-of: wind-park }
spec:
  # One replica: the app simulates the fleet, a second would duplicate every turbine.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wind-turbine-producer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wind-turbine-producer, app.kubernetes.io/part-of: wind-park }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: producer
          image: ${WIND_IMAGE_REGISTRY}/java/wind-turbine-producer-json:${WIND_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: wind-producer-config }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
