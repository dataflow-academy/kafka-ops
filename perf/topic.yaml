apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: ${PERF_NAME}
  labels:
    strimzi.io/cluster: my-cluster
    app.kubernetes.io/part-of: perf
spec:
  # The Kafka topic name follows the platform's naming convention; the resource name stays a plain Kubernetes name.
  topicName: ${PERF_TOPIC}
  partitions: ${PERF_PARTITIONS}
  replicas: ${PERF_REPLICAS}
  config:
    min.insync.replicas: "${PERF_MIN_ISR}"
    retention.ms: "600000"
