# The frame for the lab: MirrorMaker 2 runs in your cluster and pulls from the cluster of the neighbor group.
# The connection to your own cluster is done; the neighbor and the decisions are yours.
apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: mm2
  namespace: kafka
spec:
  replicas: 1
  target:
    # The name of your region (lowercase letters).
    alias: ""
    bootstrapServers: nordwind-kafka-kafka-bootstrap.kafka.svc:9092
    groupId: mm2-cluster
    configStorageTopic: mm2-configs
    offsetStorageTopic: mm2-offsets
    statusStorageTopic: mm2-status
    config:
      config.storage.replication.factor: 3
      offset.storage.replication.factor: 3
      status.storage.replication.factor: 3
  mirrors:
    - source:
        # The name of the neighbor's region, and the address of their external listener.
        alias: ""
        bootstrapServers: ""
      # Which topics and which consumer groups are copied?
      topicsPattern: ""
      groupsPattern: ""
      sourceConnector:
        tasksMax: 2
        config:
          replication.factor: 3
          offset-syncs.topic.replication.factor: 3
          # MirrorMaker 2 only reads from the neighbor: its own bookkeeping stays in your cluster.
          offset-syncs.topic.location: target
          sync.topic.acls.enabled: "false"
          refresh.topics.interval.seconds: 30
      checkpointConnector:
        tasksMax: 1
        config:
          checkpoints.topic.replication.factor: 3
          offset-syncs.topic.location: target
          emit.checkpoints.interval.seconds: 10
          refresh.groups.interval.seconds: 30
          # What does your cluster need to do with the offsets of the groups?
