# The second cluster of the multi-cluster lab ("dr"), in its own namespace. Three nodes with both roles
# (controller and broker): a small cluster is enough for a mirror, and it fits next to the first one.
# No version is set: the operator's default Kafka version is used.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka-dr
  labels:
    strimzi.io/cluster: dr-cluster
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        kraftMetadata: shared
        deleteClaim: true
  resources:
    requests: { memory: 1Gi, cpu: 300m }
    limits: { memory: 1536Mi }
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/pool-name: dual
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: dr-cluster
  namespace: kafka-dr
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      # Reachable from the VMs (the self-checks): NodePort 31194, one per broker behind it.
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodePortAddressType: InternalIP
          bootstrap:
            nodePort: 31194
          brokers:
            - broker: 0
              nodePort: 31195
            - broker: 1
              nodePort: 31196
            - broker: 2
              nodePort: 31197
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
