# MirrorMaker 2, active/passive: copies topics and consumer group offsets from `primary` to `dr`.
# It runs in the namespace of the target cluster (Kafka Connect writes its internal topics there).
apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: mm2
  namespace: kafka-dr
spec:
  replicas: 1
  target:
    alias: dr
    bootstrapServers: dr-cluster-kafka-bootstrap.kafka-dr.svc:9092
    groupId: mm2-cluster
    configStorageTopic: mm2-configs
    offsetStorageTopic: mm2-offsets
    statusStorageTopic: mm2-status
    config:
      config.storage.replication.factor: 3
      offset.storage.replication.factor: 3
      status.storage.replication.factor: 3
  mirrors:
    - source:
        alias: primary
        bootstrapServers: nordwind-kafka-kafka-bootstrap.kafka.svc:9092
      topicsPattern: "telemetry|turbine-registry|park-registry|nordwind\\..*"
      groupsPattern: "control-room|forecast|billing"
      sourceConnector:
        tasksMax: 2
        config:
          # Same topic names in both clusters, so that applications only change the bootstrap address.
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          replication.factor: 3
          offset-syncs.topic.replication.factor: 3
          refresh.topics.interval.seconds: 30
          sync.topic.configs.enabled: "true"
      checkpointConnector:
        tasksMax: 1
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          checkpoints.topic.replication.factor: 3
          # Writes the translated offsets of the groups into the dr cluster (for groups without active members).
          sync.group.offsets.enabled: "true"
          sync.group.offsets.interval.seconds: 10
          emit.checkpoints.interval.seconds: 10
          refresh.groups.interval.seconds: 30
