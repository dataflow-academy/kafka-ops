# A solution for a group whose region is "nord" and whose neighbor is "sued" at 203.0.113.10. Your region names and
# the neighbor's address are your own. Over the TLS listener (extra task) the source gets port 31194 and the `tls` part.
apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: mm2
  namespace: kafka
spec:
  replicas: 1
  target:
    alias: nord
    bootstrapServers: nordwind-kafka-kafka-bootstrap.kafka.svc:9092
    groupId: mm2-cluster
    configStorageTopic: mm2-configs
    offsetStorageTopic: mm2-offsets
    statusStorageTopic: mm2-status
    config:
      config.storage.replication.factor: 3
      offset.storage.replication.factor: 3
      status.storage.replication.factor: 3
  mirrors:
    - source:
        alias: sued
        # Any node of the neighbor: the external listener (NodePort 31094) on its public address.
        bootstrapServers: 203.0.113.10:31094
        # Extra task, over TLS: the TLS listener of the neighbor and their cluster CA. The broker certificates do not
        # carry the node addresses, so the host name check is off; the certificate chain is still checked.
        # bootstrapServers: 203.0.113.10:31194
        # tls:
        #   trustedCertificates:
        #     - secretName: neighbor-cluster-ca
        #       certificate: ca.crt
        # config:
        #   ssl.endpoint.identification.algorithm: ""
      # The default naming policy puts the source alias in front: sued.telemetry. Your own telemetry stays apart.
      topicsPattern: "telemetry"
      groupsPattern: "report-sued"
      sourceConnector:
        tasksMax: 2
        config:
          replication.factor: 3
          offset-syncs.topic.replication.factor: 3
          offset-syncs.topic.location: target
          sync.topic.acls.enabled: "false"
          refresh.topics.interval.seconds: 30
      checkpointConnector:
        tasksMax: 1
        config:
          checkpoints.topic.replication.factor: 3
          offset-syncs.topic.location: target
          emit.checkpoints.interval.seconds: 10
          refresh.groups.interval.seconds: 30
          # Writes the translated offsets of the groups into your cluster (for groups without active members here).
          sync.group.offsets.enabled: "true"
          sync.group.offsets.interval.seconds: 10
