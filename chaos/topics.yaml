#   unclean.leader.election.enable  "true" or "false" (a string)
# The third part of the triple, acks, belongs to the producer (see the lab).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: nordwind-chaos-telemetry
  namespace: kafka
  labels: { strimzi.io/cluster: my-cluster, training/experiment: failures }
spec:
  topicName: nordwind.chaos.private.telemetry.event
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: "TODO"
