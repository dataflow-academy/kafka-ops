# A topic of its own for the quota measurement, so that the load test never touches live data.
# Follows the naming convention; reset.sh removes it (label training/experiment).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: nordwind-demo-quota
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
    training/experiment: governance
spec:
  topicName: nordwind.demo.private.quota-test.event
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: "2"
