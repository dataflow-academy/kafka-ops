apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: nordwind-demo-grandfathered
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
    governance.nordwind/grandfathered: "true"
spec:
  topicName: demo_before_the_convention
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: "2"
