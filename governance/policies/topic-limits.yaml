# Limits for topics: at least three replicas, not more than 24 partitions, and min.insync.replicas below the
# replication factor (otherwise one restarted broker stops every producer).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kafkatopic-limits
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kafka.strimzi.io"]
        apiVersions: ["v1"]
        resources: ["kafkatopics"]
        operations: ["CREATE", "UPDATE"]
  # A topic that is being deleted must stay editable: the topic operator removes its finalizer with an update,
  # and a policy that refuses it leaves the KafkaTopic in Terminating forever.
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: replicas
      expression: "has(object.spec.replicas) ? object.spec.replicas : 3"
  validations:
    - expression: "variables.replicas >= 3"
      message: "A topic needs at least three replicas."
    - expression: "!has(object.spec.partitions) || object.spec.partitions <= 24"
      message: "A topic may have at most 24 partitions. Ask the platform team if you need more."
    - expression: >-
        !has(object.spec.config) || !('min.insync.replicas' in object.spec.config) ||
        int(string(object.spec.config['min.insync.replicas'])) < variables.replicas
      message: "min.insync.replicas must be lower than the number of replicas."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kafkatopic-limits
spec:
  policyName: kafkatopic-limits
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: kafka }
