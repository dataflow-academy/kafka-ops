# Naming convention for topics as a ValidatingAdmissionPolicy: Kubernetes rejects a KafkaTopic whose topic name does
# not look like  nordwind.<domain>.<public|private>.<entity>.<event|state|command>
#
# The name of the topic is NOT always metadata.name: a KafkaTopic may carry the real name in spec.topicName (needed
# for names Kubernetes does not allow, like underscores). Check what Kafka will really see.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kafkatopic-naming
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kafka.strimzi.io"]
        apiVersions: ["v1"]
        resources: ["kafkatopics"]
        operations: ["CREATE", "UPDATE"]
  # A topic that is being deleted must stay editable: the topic operator removes its finalizer with an update,
  # and a policy that refuses it leaves the KafkaTopic in Terminating forever.
  matchConditions:
    - name: not-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: topicName
      expression: "TODO"
  validations:
    - expression: "variables.topicName.matches('TODO')"
      messageExpression: "'The topic name ' + variables.topicName + ' does not follow nordwind.<domain>.<public|private>.<entity>.<event|state|command>'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kafkatopic-naming
spec:
  policyName: kafkatopic-naming
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: kafka }
