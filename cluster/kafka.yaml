# Kafka cluster, KRaft, three controllers and three brokers on three nodes.
# auto.create.topics.enable stays at the Kafka default (true) on purpose.
# No metrics here: the monitoring lab switches them on (monitoring/prepare.sh), which rolls the cluster.
# Kafka 4.2.1 on Strimzi 1.1.0: one minor below the newest, so that the upgrade lab has a real step to take.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
  annotations:
    # Fixed node ids: brokers 0-2, controllers 100-102.
    strimzi.io/next-node-ids: "[100-102]"
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        kraftMetadata: shared
        deleteClaim: false
  resources:
    requests: { memory: 768Mi, cpu: 200m }
    limits: { memory: 1Gi }
  jvmOptions:
    "-Xms": 384m
    "-Xmx": 384m
  template:
    pod:
      # One controller per node: their number does not grow, so the rule can be a requirement.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/pool-name: controller
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
  annotations:
    strimzi.io/next-node-ids: "[0-2]"
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        kraftMetadata: shared
        deleteClaim: false
  resources:
    requests: { memory: 2Gi, cpu: "1" }
    limits: { memory: 3Gi }
  jvmOptions:
    "-Xms": 1g
    "-Xmx": 1g
  template:
    pod:
      # Spread the brokers over the nodes, but only as a preference: a fourth
      # broker (Cruise Control add-brokers) must still fit on the same three nodes.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    strimzi.io/pool-name: broker
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nordwind-kafka
  namespace: kafka
spec:
  kafka:
    version: 4.2.1
    metadataVersion: 4.2-IV1
    # The node name becomes broker.rack, so replicas spread over the nodes.
    rack:
      topologyKey: kubernetes.io/hostname
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      # Reachable from the VMs themselves (tests, perf tools): bootstrap on
      # NodePort 31094 of any node, one NodePort per broker behind it.
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodePortAddressType: InternalIP
          bootstrap:
            nodePort: 31094
          brokers:
            - broker: 0
              nodePort: 31095
            - broker: 1
              nodePort: 31096
            - broker: 2
              nodePort: 31097
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
