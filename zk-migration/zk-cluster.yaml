# The ZooKeeper cluster the migration lab starts from: Strimzi 0.45, Kafka 3.9, three ZooKeeper nodes and three
# brokers, no node pools yet (the lab introduces them). Old API version on purpose: v1beta2.
# ${...} placeholders come from ../versions.env (see prepare.sh).
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ${KAFKA_CLUSTER}
spec:
  kafka:
    version: ${KAFKA_ZK_VERSION}
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodePortAddressType: InternalIP
          bootstrap:
            nodePort: 31094
          brokers:
            - broker: 0
              nodePort: 31095
            - broker: 1
              nodePort: 31096
            - broker: 2
              nodePort: 31097
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
    resources:
      requests: { memory: 2Gi, cpu: "1" }
      limits: { memory: 3Gi }
    jvmOptions:
      "-Xms": 1g
      "-Xmx": 1g
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: true
    resources:
      requests: { memory: 768Mi, cpu: 200m }
      limits: { memory: 1Gi }
    jvmOptions:
      "-Xms": 384m
      "-Xmx": 384m
  entityOperator:
    topicOperator: {}
    userOperator: {}
