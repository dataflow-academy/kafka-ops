# Background load for the migration: a topic with three partitions and a producer that writes 50 records per
# second. A migration without traffic proves nothing. ${...} placeholders come from ../versions.env.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: migration-demo
  labels:
    strimzi.io/cluster: ${KAFKA_CLUSTER}
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-producer
  labels: { app.kubernetes.io/name: migration-producer, app.kubernetes.io/part-of: zk-migration }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: migration-producer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: migration-producer, app.kubernetes.io/part-of: zk-migration }
    spec:
      containers:
        - name: producer
          image: quay.io/strimzi/kafka:${STRIMZI_ZK_VERSION}-kafka-${KAFKA_ZK_VERSION}
          command: [sh, -c]
          args:
            - >-
              bin/kafka-producer-perf-test.sh --topic migration-demo --num-records 1000000000 --record-size 200
              --throughput 50 --producer-props bootstrap.servers=${KAFKA_CLUSTER}-kafka-bootstrap:9092 acks=all
              enable.idempotence=true retries=2147483647
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
