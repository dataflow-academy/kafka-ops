# Background load for the migration: a topic with three partitions and a producer that writes 50 records per
# second. A migration without traffic proves nothing.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: migration-demo
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-producer
  namespace: kafka
  labels: { app.kubernetes.io/name: migration-producer, app.kubernetes.io/part-of: zk-migration }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: migration-producer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: migration-producer, app.kubernetes.io/part-of: zk-migration }
    spec:
      containers:
        - name: producer
          image: quay.io/strimzi/kafka:0.45.1-kafka-3.9.1
          command: [sh, -c]
          args:
            - >-
              bin/kafka-producer-perf-test.sh --topic migration-demo --num-records 1000000000 --record-size 200
              --throughput 50 --producer-props bootstrap.servers=nordwind-kafka-kafka-bootstrap:9092 acks=all
              enable.idempotence=true retries=2147483647
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
