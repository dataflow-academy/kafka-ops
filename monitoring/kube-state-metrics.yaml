# kube-state-metrics: turns the state of Kubernetes objects into metrics (pod restarts, failed jobs,
# deployments without available replicas). The lab alerts on crash loops and failed jobs with it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-${KAFKA_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-${KAFKA_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-${KAFKA_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: ${KAFKA_NAMESPACE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: { app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: monitoring }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kube-state-metrics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: monitoring }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:${KUBE_STATE_METRICS_VERSION}
          args:
            - --resources=pods,deployments,jobs,cronjobs,nodes
          ports:
            - { name: metrics, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
          resources:
            requests: { memory: 64Mi, cpu: 20m }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports:
    - { name: metrics, port: 8080, targetPort: metrics }
