apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels: { app.kubernetes.io/name: kafka-ui, app.kubernetes.io/part-of: monitoring }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka-ui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-ui, app.kubernetes.io/part-of: monitoring }
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          env:
            - { name: KAFKA_CLUSTERS_0_NAME, value: "my-cluster" }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "my-cluster-kafka-bootstrap:9092" }
            - { name: DYNAMIC_CONFIG_ENABLED, value: "false" }
            - { name: JAVA_OPTS, value: "-Xmx384m" }
          ports:
            - { name: web, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /actuator/health, port: web }
            initialDelaySeconds: 20
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: kafka-ui }
  ports:
    - { name: web, port: 8080, targetPort: web, nodePort: 30800 }
