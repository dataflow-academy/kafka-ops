        labels: { severity: TODO }
        annotations:
          summary: The number of active controllers is not 1
  - name: dev-view
    rules:
      # Lag in seconds: how far behind is a group, measured in how long the topic takes to produce that many records.
      - alert: ConsumerGroupFallingBehind
        expr: |
          sum by (consumergroup, topic) (kafka_consumergroup_lag)
            / on (topic) group_left
          sum by (topic) (rate(kafka_topic_partition_current_offset[2m])) > TODO
        for: TODO
        labels: { severity: TODO }
        annotations:
          summary: A consumer group is more than the threshold behind (the threshold is in seconds)
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="windpark"}[15m]) > 2
        for: TODO
        labels: { severity: TODO }
        annotations:
          summary: A pod of a team restarts again and again
      - alert: JobFailed
        expr: kube_job_status_failed{namespace="windpark"} > 0
        for: TODO
        labels: { severity: TODO }
        annotations:
          summary: A job of a team has failed
