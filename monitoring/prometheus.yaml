# Plain Prometheus, no Prometheus Operator: one Deployment, scrape targets found
# through the Kubernetes API. The relabeling mirrors Strimzi's example PodMonitors,
# so the Strimzi dashboards find the labels they expect.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-${KAFKA_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-${KAFKA_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-${KAFKA_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: ${KAFKA_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Kafka brokers, controllers, Kafka Exporter, Connect, MirrorMaker 2: port "tcp-prometheus"
      - job_name: strimzi-resources
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [${KAFKA_NAMESPACE}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
            regex: Kafka|KafkaConnect|KafkaMirrorMaker2
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: tcp-prometheus
            action: keep
          - regex: __meta_kubernetes_pod_label_(strimzi_io_.+)
            action: labelmap
            replacement: $1
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node_name
          - source_labels: [__meta_kubernetes_pod_host_ip]
            target_label: node_ip
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
            target_label: strimzi_cluster_name
      - job_name: strimzi-cluster-operator
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [${KAFKA_NAMESPACE}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
            regex: cluster-operator
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
      - job_name: strimzi-entity-operator
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [${KAFKA_NAMESPACE}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: entity-operator
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: healthcheck-to|healthcheck-uo
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
      # Pod CPU and memory, PVC usage: kubelet and cAdvisor through the API server
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config: { insecure_skip_verify: true }
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        kubernetes_sd_configs:
          - role: node
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node_name
      - job_name: kubelet
        scheme: https
        tls_config: { insecure_skip_verify: true }
        authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node_name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: monitoring }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: monitoring }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:${PROMETHEUS_VERSION}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: web, nodePort: 30900 }
