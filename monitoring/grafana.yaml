apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: strimzi
        folder: Kafka
        type: file
        options: { path: /var/lib/grafana-dashboards }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: monitoring }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: monitoring }
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.3
          env:
            # Same credentials as the former Grafana on the VM: admin / admin, no login wall for the lab.
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana-dashboards/strimzi-kafka.json }
          ports:
            - { name: web, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: web }
          resources:
            requests: { memory: 192Mi, cpu: 50m }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana-dashboards }
      volumes:
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items: [{ key: datasource.yaml, path: datasource.yaml }]
        - name: provisioning-db
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - name: dashboards
          projected:
            sources:
              - configMap: { name: dashboards-strimzi-kafka }
              - configMap: { name: dashboards-strimzi-kraft }
              - configMap: { name: dashboards-strimzi-kafka-exporter }
              - configMap: { name: dashboards-strimzi-operators }
              - configMap: { name: dashboards-wind-park }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: web, port: 3000, targetPort: web, nodePort: 30300 }
