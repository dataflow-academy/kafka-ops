# Team Alerts writes its alerts into a topic of its own. It is not a SCADA topic, so the ACL names it.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: alerts
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: nordwind.alerts.public.windpark-alert.event
          patternType: literal
        operations: [Write, Describe, Create]
