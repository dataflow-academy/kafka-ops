# A pod with the Kafka command line tools (kafka-topics.sh, kafka-consumer-groups.sh, ...), always on
# node1 so that it survives the failure of the other nodes. Use it where you want to stand INSIDE the cluster:
#   kubectl exec -i deploy/kafka-tools -- kafka-topics.sh --bootstrap-server nordwind-kafka-kafka-bootstrap:9092 --list
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-tools
  namespace: kafka
  labels: { app.kubernetes.io/name: kafka-tools }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka-tools }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-tools }
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: Exists }
      containers:
        - name: tools
          image: quay.io/strimzi/kafka:1.1.0-kafka-4.2.1
          command: ["sleep", "infinity"]
          env:
            - { name: PATH, value: "/opt/kafka/bin:/usr/local/bin:/usr/bin:/bin" }
            # Every command is a JVM of its own; keep them small so several fit next to each other.
            - { name: KAFKA_HEAP_OPTS, value: "-Xms32m -Xmx160m" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 2Gi }
