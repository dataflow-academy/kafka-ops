# Team Wartung: after every service round the maintenance tool reports the turbine it worked on,
# as one record in the telemetry topic (written with the console producer).
apiVersion: v1
kind: ConfigMap
metadata:
  name: wartung-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: my-cluster-kafka-bootstrap.kafka.svc:9092
  TOPIC: telemetry
  TURBINE: alpha-ventus-07
  POWER_KW: "0.0"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wartung-meldung
  namespace: windpark
  labels:
    app.kubernetes.io/name: wartung-meldung
    app.kubernetes.io/part-of: wind-park
    team: wartung
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wartung-meldung
            app.kubernetes.io/part-of: wind-park
            team: wartung
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: wartung-config
              env:
                - name: KAFKA_HEAP_OPTS
                  value: "-Xmx128m"
              command:
                - /bin/bash
                - -c
                - |
                  now=$(date +%s%3N)
                  # a reading that is not a number is written as text
                  case "$POWER_KW" in *[!0-9.]*) POWER_KW="\"$POWER_KW\"" ;; esac
                  printf '%s|{"wind_turbine_id":"%s","wind_park_id":"%s","timestamp":%s,"wind_speed_ms":6.5,"power_kw":%s,"status":"MAINTENANCE"}\n' \
                    "$TURBINE" "$TURBINE" "${TURBINE%-*}" "$now" "$POWER_KW" |
                  /opt/kafka/bin/kafka-console-producer.sh \
                    --bootstrap-server "$BOOTSTRAP_SERVERS" --topic "$TOPIC" \
                    --reader-property parse.key=true --reader-property 'key.separator=|'
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 192Mi
                limits:
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          volumes:
            - name: tmp
              emptyDir: {}
---
# Team Alarme: writes an alert record every ten seconds into its own topic.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: nordwind.alarme.public.windpark-alert.event
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
    app.kubernetes.io/part-of: wind-park
spec:
  partitions: 3
  replicas: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alarme-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: my-cluster-kafka-bootstrap.kafka.svc:9092
  TOPIC: nordwind.alarme.public.windpark-alert.event
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarme
  namespace: windpark
  labels:
    app.kubernetes.io/name: alarme
    app.kubernetes.io/part-of: wind-park
    team: alarme
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alarme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alarme
        app.kubernetes.io/part-of: wind-park
        team: alarme
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alerts
          image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: alarme-config
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx128m"
          command:
            - /bin/bash
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                printf 'alert-%s|{"alert":"wind-gust","park":"alpha-ventus","seq":%s}\n' "$i" "$i"
                sleep 10
              done |
              /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "$BOOTSTRAP_SERVERS" --topic "$TOPIC" \
                --reader-property parse.key=true --reader-property 'key.separator=|'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}
