# The wind park of Nordwind: the applications of six teams. Every setting of an application is a value in
# its ConfigMap. All resources carry their own namespace (windpark, or kafka for the KafkaTopic).
apiVersion: v1
kind: Namespace
metadata:
  name: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
---
# Team SCADA: the telemetry producer of the wind park (50 turbines, one record per turbine and tick).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scada-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: my-cluster-kafka-bootstrap.kafka.svc:9092
  TOPIC: telemetry
  TICK_INTERVAL_MS: "250"
  KAFKA_ACKS: all
  KAFKA_LINGER_MS: "10"
  KAFKA_COMPRESSION_TYPE: zstd
  JAVA_OPTS: -XX:MaxRAMPercentage=70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scada-telemetry
  namespace: windpark
  labels:
    app.kubernetes.io/name: scada-telemetry
    app.kubernetes.io/part-of: wind-park
    team: scada
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scada-telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scada-telemetry
        app.kubernetes.io/part-of: wind-park
        team: scada
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: ghcr.io/dataflow-academy/java/wind-turbine-producer-json:5fa95d96abc154b3db3c16b9b80602328876bda0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: scada-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}
---
# Team Assets: publishes the master data (turbines and parks) as a full snapshot every 20 seconds.
# The application writes everything, waits for the acknowledgements and exits non-zero if a delivery fails;
# the pod restarts and starts the next round.
apiVersion: v1
kind: ConfigMap
metadata:
  name: assets-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: my-cluster-kafka-bootstrap.kafka.svc:9092
  TURBINE_REGISTRY_TOPIC: turbine-registry
  PARK_REGISTRY_TOPIC: park-registry
  KAFKA_REQUEST_TIMEOUT_MS: "5000"
  KAFKA_DELIVERY_TIMEOUT_MS: "10000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assets-stammdaten
  namespace: windpark
  labels:
    app.kubernetes.io/name: assets-stammdaten
    app.kubernetes.io/part-of: wind-park
    team: assets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assets-stammdaten
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assets-stammdaten
        app.kubernetes.io/part-of: wind-park
        team: assets
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: ghcr.io/dataflow-academy/python/wind-masterdata-producer:5fa95d96abc154b3db3c16b9b80602328876bda0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "while true; do wind-masterdata-producer || exit 1; sleep 20; done"]
          envFrom:
            - configMapRef:
                name: assets-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}
---
