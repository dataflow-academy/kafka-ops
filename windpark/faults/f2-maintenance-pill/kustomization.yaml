# F2: the maintenance tool writes "n/a" instead of a number into power_kw. Every consumer that reads
# the record dies on it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: wartung-config
    namespace: windpark
    behavior: merge
    literals:
      - POWER_KW="n/a"
