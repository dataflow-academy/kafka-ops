# F3: team Alarme built its own topic: wrong name, one partition, one replica, and min.insync.replicas=1
# because producing with the cluster default failed.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - topic.yaml
patches:
  - target: { kind: KafkaTopic, name: nordwind.alarme.public.windpark-alert.event }
    patch: |-
      $patch: delete
      apiVersion: kafka.strimzi.io/v1
      kind: KafkaTopic
      metadata:
        name: nordwind.alarme.public.windpark-alert.event
        namespace: kafka
configMapGenerator:
  - name: alarme-config
    namespace: windpark
    behavior: merge
    literals:
      - TOPIC=windpark_alerts
