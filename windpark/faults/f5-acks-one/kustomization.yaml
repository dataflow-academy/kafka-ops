# F5: SCADA writes with acks=1 "because it is faster". The producer refuses to start with acks=1 and
# idempotence enabled, so idempotence is switched off as well.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: scada-config
    namespace: windpark
    behavior: merge
    literals:
      - KAFKA_ACKS=1
      - KAFKA_ENABLE_IDEMPOTENCE=false
