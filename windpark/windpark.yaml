---
# Team Maintenance: after every service round the maintenance tool reports the turbine it worked on,
# as one record in the telemetry topic (written with the console producer).
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: nordwind-kafka-kafka-bootstrap.kafka.svc:9092
  TOPIC: telemetry
  TURBINE: alpha-ventus-07
  POWER_KW: "n/a"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maintenance-report
  namespace: windpark
  labels:
    app.kubernetes.io/name: maintenance-report
    app.kubernetes.io/part-of: wind-park
    team: maintenance
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maintenance-report
            app.kubernetes.io/part-of: wind-park
            team: maintenance
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: maintenance-config
              env:
                - name: KAFKA_HEAP_OPTS
                  value: "-Xmx128m"
              command:
                - /bin/bash
                - -c
                - |
                  now=$(date +%s%3N)
                  # a reading that is not a number is written as text
                  case "$POWER_KW" in *[!0-9.]*) POWER_KW="\"$POWER_KW\"" ;; esac
                  printf '%s|{"wind_turbine_id":"%s","wind_park_id":"%s","timestamp":%s,"wind_speed_ms":6.5,"power_kw":%s,"status":"MAINTENANCE"}\n' \
                    "$TURBINE" "$TURBINE" "${TURBINE%-*}" "$now" "$POWER_KW" |
                  /opt/kafka/bin/kafka-console-producer.sh \
                    --bootstrap-server "$BOOTSTRAP_SERVERS" --topic "$TOPIC" \
                    --reader-property parse.key=true --reader-property 'key.separator=|'
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 192Mi
                limits:
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
          volumes:
            - name: tmp
              emptyDir: {}
---
# Team Alerts: writes an alert record every ten seconds into its own topic.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: windpark-alerts
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
    app.kubernetes.io/part-of: wind-park
spec:
  topicName: windpark_alerts
  partitions: 1
  replicas: 1
  config:
    min.insync.replicas: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerts-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: nordwind-kafka-kafka-bootstrap.kafka.svc:9092
  TOPIC: windpark_alerts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts
  namespace: windpark
  labels:
    app.kubernetes.io/name: alerts
    app.kubernetes.io/part-of: wind-park
    team: alerts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alerts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerts
        app.kubernetes.io/part-of: wind-park
        team: alerts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alerts
          image: quay.io/strimzi/kafka:1.1.0-kafka-4.3.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: alerts-config
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx128m"
          command:
            - /bin/bash
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                printf 'alert-%s|{"alert":"wind-gust","park":"alpha-ventus","seq":%s}\n' "$i" "$i"
                sleep 10
              done |
              /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "$BOOTSTRAP_SERVERS" --topic "$TOPIC" \
                --reader-property parse.key=true --reader-property 'key.separator=|'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}
