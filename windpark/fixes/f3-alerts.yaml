# Team Alerts with its own topic (F3), applied on top of the healthy wind park: the state after the lab
# "Helping the dev teams" keeps this fault until the governance lab.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: windpark-alerts
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
    app.kubernetes.io/part-of: wind-park
spec:
  topicName: windpark_alerts
  partitions: 1
  replicas: 1
  config:
    min.insync.replicas: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alerts-config
  namespace: windpark
  labels:
    app.kubernetes.io/part-of: wind-park
data:
  BOOTSTRAP_SERVERS: nordwind-kafka-kafka-bootstrap.kafka.svc:9092
  TOPIC: windpark_alerts
