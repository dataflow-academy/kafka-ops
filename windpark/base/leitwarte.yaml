# Team Leitwarte: reads the telemetry in the consumer group `leitwarte`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leitwarte
  namespace: windpark
  labels: { app.kubernetes.io/name: leitwarte, app.kubernetes.io/part-of: wind-park, team: leitwarte }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: leitwarte }
  template:
    metadata:
      labels: { app.kubernetes.io/name: leitwarte, app.kubernetes.io/part-of: wind-park, team: leitwarte }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: consumer
          image: ${WIND_IMAGE_REGISTRY}/java/wind-turbine-consumer-json:${WIND_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: leitwarte-config }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
