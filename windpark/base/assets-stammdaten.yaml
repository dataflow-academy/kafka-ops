# Team Assets: publishes the master data (turbines and parks) as a full snapshot every two minutes.
# The application is a job: it writes everything, waits for the acknowledgements and exits. A failed
# delivery makes the job fail.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: assets-stammdaten
  namespace: windpark
  labels: { app.kubernetes.io/name: assets-stammdaten, app.kubernetes.io/part-of: wind-park, team: assets }
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: { app.kubernetes.io/name: assets-stammdaten, app.kubernetes.io/part-of: wind-park, team: assets }
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: producer
              image: ${WIND_IMAGE_REGISTRY}/python/wind-masterdata-producer:${WIND_IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: { name: assets-config }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 50m, memory: 96Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
          volumes:
            - { name: tmp, emptyDir: {} }
