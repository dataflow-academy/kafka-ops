# Team Abrechnung: reads the telemetry in the consumer group `abrechnung` (an older application: it still uses the classic group protocol).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abrechnung
  namespace: windpark
  labels: { app.kubernetes.io/name: abrechnung, app.kubernetes.io/part-of: wind-park, team: abrechnung }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: abrechnung }
  template:
    metadata:
      labels: { app.kubernetes.io/name: abrechnung, app.kubernetes.io/part-of: wind-park, team: abrechnung }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: consumer
          image: ${WIND_IMAGE_REGISTRY}/java/wind-turbine-consumer-json:${WIND_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: abrechnung-config }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
