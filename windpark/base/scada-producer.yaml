# Team SCADA: the telemetry producer of the wind park (50 turbines, one record per turbine and tick).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scada-telemetry
  namespace: windpark
  labels: { app.kubernetes.io/name: scada-telemetry, app.kubernetes.io/part-of: wind-park, team: scada }
spec:
  # One replica: the application simulates the whole fleet, a second one would duplicate every turbine.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: scada-telemetry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scada-telemetry, app.kubernetes.io/part-of: wind-park, team: scada }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: producer
          image: ${WIND_IMAGE_REGISTRY}/java/wind-turbine-producer-json:${WIND_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: scada-config }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
