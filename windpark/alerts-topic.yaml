# The topic team Alerts should have had from the start: three partitions, three replicas.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: nordwind.alerts.public.windpark-alert.event
  namespace: kafka
  labels:
    strimzi.io/cluster: nordwind-kafka
    app.kubernetes.io/part-of: wind-park
spec:
  partitions: 3
  replicas: 3
