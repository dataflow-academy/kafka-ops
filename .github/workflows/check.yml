name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scripts-and-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x lib/common.sh */*.sh
      - name: Numbered incident entry points
        run: python3 -m unittest discover -s tests -v
