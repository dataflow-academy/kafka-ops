name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scripts-and-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x lib/common.sh */*.sh
      - name: Wind park manifests
        # PyYAML ships with the runner image; the apt line is a no-op there.
        run: |
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 -m unittest discover -s tests -v
