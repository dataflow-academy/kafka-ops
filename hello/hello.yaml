# The smallest Kafka cluster Strimzi can run: one node that is controller and broker at once, no
# persistent storage. For the first lab only; the real cluster is designed later.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: single
  namespace: kafka
  labels:
    strimzi.io/cluster: hello
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
  resources:
    requests: { memory: 768Mi, cpu: 200m }
    limits: { memory: 1Gi }
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: hello
  namespace: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      # Reachable from the VM itself (the self-checks of the labs use it).
      - name: external
        port: 9094
        type: nodeport
        tls: false
        configuration:
          preferredNodePortAddressType: InternalIP
          bootstrap:
            nodePort: 31094
          brokers:
            - broker: 0
              nodePort: 31095
    config:
      # One node: nothing can be replicated.
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator: {}
